name: Attach APK to Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          validate-wrappers: false

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "FocusForge v1.2.0 (Accessibility App Blocker - 100% HyperOS Fix)"
          body: |
            ### Pembaruan v1.2.0:
            - **Accessibility Service Blocker (Standar Industri)**: Menggantikan sistem polling lama dengan Accessibility Service event-driven. Memotong akses aplikasi di luar whitelist secara 0ms instan tanpa terhambat bug background restriction Xiaomi.
            - **Perbaikan Masalah Pop-up**: Pop-up blokir kini langsung muncul saat aplikasi terlarang (IG/TikTok/Game) dibuka, dan TIDAK AKAN PERNAH salah muncul di aplikasi FocusForge sendiri.
            - **Zero Resource Polling**: Tidak ada lagi loop background yang boros baterai; sistem hanya bereaksi saat ada perpindahan aplikasi.
            - **Akses Bebas Mode Istirahat (Rest)**: Selama fase istirahat, blocker otomatis mati 100% dan bebas buka aplikasi apa pun.
            - **Checklist Izin Aksesibilitas**: Status izin Layanan Aksesibilitas kini dapat diaktifkan dan dipantau langsung di menu Pengaturan aplikasi.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
